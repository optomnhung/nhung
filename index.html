    <!-- Custom CSS -->
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }

        ::-webkit-scrollbar-thumb {
            background: #E11D48;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #BE123C;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF7;
            overflow-x: hidden;
            overflow-y: hidden;
            /* Khóa cuộn lúc đầu */
            height: 100vh;
        }

        /* Hiệu ứng trượt lên khi cuộn */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(80px) scale(0.9);
            filter: blur(8px);
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .fade-up-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        @keyframes slideUpFast {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gate-panel {
            transition: transform 2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        /* Hiệu ứng cánh hoa rơi (Falling Petals) */
        #petal-container {
            position: fixed;
            /* Giữ cố định trên toàn bộ màn hình */
            top: -50px;
            /* Bắt đầu từ phía trên màn hình một chút */
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            /* Đảm bảo cánh hoa rơi trên các lớp khác nhưng dưới Lightbox */
            overflow: hidden;
            /* Không hiện thanh cuộn */
            pointer-events: none;
            /* Cánh hoa không ảnh hưởng đến việc click */
        }

        .petal {
            position: absolute;
            background-color: #ffc0cb;
            /* Màu hồng nhẹ cho cánh hoa */
            border-radius: 150% 0 150% 100%;
            /* Tạo hình dáng cánh hoa */
            opacity: 0.8;
            filter: blur(0.5px);
            /* Làm mờ một chút cho mềm mại */
            animation: fall linear infinite;
            /* Sử dụng hoạt ảnh tên là 'fall' */
        }

        /* Định nghĩa hoạt ảnh 'fall' */
        @keyframes fall {
            0% {
                transform: translateY(0vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
                /* Cánh hoa hiện rõ hơn sau khi bắt đầu rơi */
            }

            100% {
                /* Cánh hoa rơi xuống cuối màn hình, sang trái và xoay */
                transform: translateY(105vh) translateX(-200px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Tạo nhiều cánh hoa với kích thước và độ trễ khác nhau */
        #petal-container .petal:nth-child(1) {
            width: 15px;
            height: 20px;
            left: 10%;
            animation-duration: 10s;
            animation-delay: 0s;
        }

        #petal-container .petal:nth-child(2) {
            width: 10px;
            height: 15px;
            left: 20%;
            animation-duration: 12s;
            animation-delay: 2s;
            background-color: #fff0f5;
        }

        #petal-container .petal:nth-child(3) {
            width: 18px;
            height: 25px;
            left: 35%;
            animation-duration: 8s;
            animation-delay: 4s;
        }

        #petal-container .petal:nth-child(4) {
            width: 12px;
            height: 18px;
            left: 50%;
            animation-duration: 15s;
            animation-delay: 1s;
            background-color: #fff;
        }

        #petal-container .petal:nth-child(5) {
            width: 20px;
            height: 28px;
            left: 65%;
            animation-duration: 9s;
            animation-delay: 6s;
        }

        #petal-container .petal:nth-child(6) {
            width: 15px;
            height: 20px;
            left: 80%;
            animation-duration: 11s;
            animation-delay: 3s;
            background-color: #ffc0cb;
        }

        #petal-container .petal:nth-child(7) {
            width: 10px;
            height: 15px;
            left: 90%;
            animation-duration: 14s;
            animation-delay: 5s;
        }

        #petal-container .petal:nth-child(8) {
            width: 18px;
            height: 25px;
            left: 5%;
            animation-duration: 10s;
            animation-delay: 7s;
            background-color: #fff0f5;
        }

        #petal-container .petal:nth-child(9) {
            width: 12px;
            height: 18px;
            left: 25%;
            animation-duration: 13s;
            animation-delay: 2s;
        }

        #petal-container .petal:nth-child(10) {
            width: 20px;
            height: 28px;
            left: 75%;
            animation-duration: 8s;
            animation-delay: 0s;
            background-color: #fff;
        }
    </style>
